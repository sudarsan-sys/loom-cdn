server:
  port: 8080

spring:
  application:
    name: cdn-server
  # --- ADD THIS SECTION ---
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  # ------------------------
  data:
    redis:
      host: localhost
      port: 6379

minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: password123
  bucket-name: cdn-assets